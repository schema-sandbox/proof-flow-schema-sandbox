name: ProofFlow CI/CD Pipeline

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  test:
    name: Run Tests & Quality Checks
    runs-on: ubuntu-latest
    permissions:
      contents: read
    strategy:
      matrix:
        python-version: ["3.12"]

    steps:
      # Actions are pinned to commit SHAs (moved forward by Dependabot).
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e .[dev]

      - name: Lint with ruff
        run: |
          ruff check .

      - name: Run Pytest Test Suite
        env:
          PYTHONPATH: apps/api
        run: |
          pytest tests/ -v --cov=schemamath_api --cov-report=xml

      - name: Export & Validate JSON Schemas
        env:
          PYTHONPATH: apps/api
        run: |
          python scripts/export_runtime_schemas.py
          python scripts/export_k0_schemas.py
          python scripts/validate_schemas.py

      - name: Export OpenAPI and detect drift
        env:
          PYTHONPATH: apps/api
        run: |
          python scripts/export_openapi.py
          git diff --exit-code -- api/openapi.json api/openapi.yaml schemas

      - name: Build frontend
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: apps/web/package-lock.json

      - name: Install and build frontend
        run: |
          npm ci --prefix apps/web
          npm run build --prefix apps/web
          python scripts/stage_wheel_ui.py

      - name: Audit frontend dependencies
        run: |
          npm audit --prefix apps/web --audit-level=high

      - name: Wheel smoke test
        run: |
          python -m pip wheel . --no-deps --no-build-isolation -w /tmp/proofflow-wheel
          python -m pip install --force-reinstall --no-deps /tmp/proofflow-wheel/*.whl
          python -c "from schemamath_api.main import create_app; print(create_app().title)"

  release-gate:
    name: Strict Release Gate
    needs: test
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Set up Python 3.12
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"

      - name: Set up Node 20
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: apps/web/package-lock.json

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e .[dev]
          npm ci --prefix apps/web

      - name: Build frontend
        run: |
          npm run build --prefix apps/web

      - name: Strict release build
        env:
          PYTHONPATH: apps/api
        run: |
          python scripts/build_release.py --strict --dist

      - name: Verify distribution checksums
        run: |
          cd dist && sha256sum -c SHA256SUMS.txt

      - name: Isolated wheel install & plugin discovery
        run: |
          python -m venv /tmp/verify_venv
          /tmp/verify_venv/bin/pip install --no-cache-dir dist/*.whl
          /tmp/verify_venv/bin/python -c "
          import schemamath_api
          from schemamath_api.plugin_host import PluginHost
          from pathlib import Path
          import tempfile
          assert schemamath_api.__version__.startswith('0.1.0')
          with tempfile.TemporaryDirectory() as root:
              host = PluginHost(
                  repository_root=Path(root),
                  plugin_root=Path(root) / 'plugins',
                  maximum_output_bytes=10*1024*1024,
                  maximum_output_files=64,
              )
              manifests = host.available_manifests()
              ids = [m.plugin_id for m in manifests]
              assert 'graphviz.local' in ids, f'graphviz.local missing: {ids}'
              assert 'python.local' in ids, f'python.local missing: {ids}'
          print('Release gate: all checks passed')
          "

      - name: Upload release artifacts
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release-assets
          path: dist/

