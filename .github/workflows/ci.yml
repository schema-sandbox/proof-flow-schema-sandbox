name: ProofFlow CI/CD Pipeline

on:
  push:
    branches: [ main, master ]
    tags: [ "v*" ]
  pull_request:
    branches: [ main, master ]

jobs:
  test:
    name: Run Tests & Quality Checks
    runs-on: ubuntu-latest
    permissions:
      contents: read
    strategy:
      matrix:
        python-version: ["3.12"]

    steps:
      # Actions are pinned to commit SHAs (moved forward by Dependabot).
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Set up Node 22
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: apps/web/package-lock.json

      - name: Install locked dependencies
        run: |
          python -m pip install pip==26.2.1
          python -m pip install -r requirements-release.lock
          python -m pip install --no-build-isolation --no-deps -e .
          npm ci --prefix apps/web

      - name: Build and stage frontend before tests
        run: |
          npm run build --prefix apps/web
          python scripts/stage_wheel_ui.py

      - name: Lint with ruff
        run: |
          ruff check .

      - name: Run Pytest Test Suite
        env:
          PYTHONPATH: apps/api
        run: |
          pytest tests/ -v --cov=schemamath_api --cov-report=xml

      - name: Export & Validate JSON Schemas
        env:
          PYTHONPATH: apps/api
        run: |
          python scripts/export_runtime_schemas.py
          python scripts/export_k0_schemas.py
          python scripts/validate_schemas.py

      - name: Export OpenAPI and detect drift
        env:
          PYTHONPATH: apps/api
        run: |
          python scripts/export_openapi.py
          git diff --exit-code -- api/openapi.json api/openapi.yaml schemas

      - name: Generate and validate release metadata
        run: |
          python scripts/generate_sbom.py
          python scripts/validate_sbom.py --official
          python scripts/validate_release_metadata.py
          git diff --exit-code -- sbom.cyclonedx.json THIRD_PARTY_NOTICES.md

      - name: Audit locked Python dependencies
        run: |
          python -m pip install pip-audit==2.10.1
          python -m pip_audit -r requirements-release.lock

      - name: Audit frontend dependencies
        run: |
          npm audit --prefix apps/web --audit-level=high

      - name: Wheel smoke test
        run: |
          python -m pip wheel . --no-deps --no-build-isolation -w /tmp/proofflow-wheel
          python -m pip install --force-reinstall --no-deps /tmp/proofflow-wheel/*.whl
          python -c "from schemamath_api.main import create_app; print(create_app().title)"

  release-gate:
    name: Strict Release Gate
    needs: test
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Set up Python 3.12
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"

      - name: Set up Node 22
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: apps/web/package-lock.json

      - name: Install locked dependencies
        run: |
          python -m pip install pip==26.2.1
          python -m pip install -r requirements-release.lock
          python -m pip install --no-build-isolation --no-deps -e .
          npm ci --prefix apps/web

      - name: Build frontend
        run: |
          npm run build --prefix apps/web

      - name: Strict release build
        env:
          PYTHONPATH: apps/api
        run: |
          python scripts/build_release.py --strict --dist

      - name: Validate packaged SBOM
        run: |
          python scripts/validate_sbom.py --official --path dist/sbom.cyclonedx.json

      - name: Verify distribution checksums
        run: |
          cd dist && sha256sum -c SHA256SUMS.txt

      - name: Isolated wheel install & plugin discovery
        run: |
          python -m venv /tmp/verify_venv
          /tmp/verify_venv/bin/pip install --no-cache-dir -r requirements-release.lock
          /tmp/verify_venv/bin/pip install --no-cache-dir --no-deps dist/*.whl
          /tmp/verify_venv/bin/python -c "
          import schemamath_api
          from schemamath_api.plugin_host import PluginHost
          from pathlib import Path
          import tempfile
          assert schemamath_api.__version__ == '0.1.0-alpha.9'
          with tempfile.TemporaryDirectory() as root:
              host = PluginHost(
                  repository_root=Path(root),
                  plugin_root=Path(root) / 'plugins',
                  maximum_output_bytes=10*1024*1024,
                  maximum_output_files=64,
              )
              manifests = host.available_manifests()
              ids = [m.plugin_id for m in manifests]
              assert 'graphviz.local' in ids, f'graphviz.local missing: {ids}'
              assert 'python.local' in ids, f'python.local missing: {ids}'
          print('Release gate: all checks passed')
          "

      - name: Upload release artifacts
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: release-assets
          path: dist/

  publish-release:
    name: Publish GitHub Prerelease
    needs: release-gate
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Download verified release assets
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: release-assets
          path: dist

      - name: Publish alpha.9 prerelease
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" dist/* \
            --verify-tag \
            --prerelease \
            --title "ProofFlow Schema Sandbox v0.1.0-alpha.9" \
            --notes-file docs/RELEASE_NOTES_v0.1.0-alpha.9.md
