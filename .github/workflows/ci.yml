name: ProofFlow CI/CD Pipeline

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  test:
    name: Run Tests & Quality Checks
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.12"]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e .[dev]

      - name: Lint with ruff
        run: |
          ruff check .

      - name: Run Pytest Test Suite
        env:
          PYTHONPATH: apps/api
        run: |
          pytest tests/ -v --cov=schemamath_api --cov-report=xml

      - name: Export & Validate JSON Schemas
        env:
          PYTHONPATH: apps/api
        run: |
          python scripts/export_runtime_schemas.py
          python scripts/export_k0_schemas.py
          python scripts/validate_schemas.py
