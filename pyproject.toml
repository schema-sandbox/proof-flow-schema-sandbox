[project]
name = "proof-flow-schema-sandbox"
version = "0.1.0-alpha.8"
description = "Local-first, human-guided experimental mathematics research sandbox"
readme = "README.md"
requires-python = ">=3.12"
license = {text = "MIT"}
authors = [{name = "Tengjiao Liu", email = "psi@psi.run"}]
dependencies = [
  "fastapi>=0.115,<1",
  "uvicorn[standard]>=0.30,<1",
  "pydantic>=2.8,<3",
  "python-multipart>=0.0.9,<1",
  # schemamath_api.sip.contract imports jsonschema at module load.
  "jsonschema>=4.22,<5",
]

[project.scripts]
proofflow = "schemamath_api.cli:main"
schemamath = "schemamath_api.cli:main"

[project.optional-dependencies]
dev = [
  "httpx>=0.27,<1",
  "pytest>=8,<10",
  "pytest-cov>=5,<7",
  "ruff>=0.8,<1",
  "pyyaml>=6,<7",
  "sympy>=1.12,<2",
]

[tool.pytest.ini_options]
pythonpath = ["apps/api"]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
ignore = [
  "E501",
  # FastAPI intentionally evaluates File/Form dependency descriptors in signatures.
  "B008",
]

[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
package-dir = {"" = "apps/api"}

[tool.setuptools.packages.find]
where = ["apps/api"]
include = ["schemamath_api*"]

# Any HTTP frontend bundle placed under apps/api/schemamath_api/_ui (prototype/
# and web_dist/) is shipped inside the wheel and served by main.py. Building it
# requires the Vite toolchain and is intentionally optional: the offline builder
# does not fabricate a bundle, so the API serves a plain-text fallback instead.
[tool.setuptools.package-data]
schemamath_api = [
  "_ui/*",
  "_ui/*/*",
  "_ui/*/*/*",
  "_plugins/*",
  "_plugins/*/*",
  "_plugins/*/*/*",
  "THIRD_PARTY_NOTICES.md",
  "sbom.cyclonedx.json",
]
