[project]
name = "proof-flow-schema-sandbox"
version = "0.1.0-alpha.9"
description = "Local-first, human-guided experimental mathematics research sandbox"
readme = "README.md"
requires-python = ">=3.12"
license = "MIT"
license-files = ["LICENSE"]
authors = [{name = "Tengjiao Liu", email = "psi@psi.run"}]
dependencies = [
  "fastapi==0.141.1",
  "uvicorn[standard]==0.52.4",
  "pydantic==2.13.4",
  "python-multipart==0.0.32",
  # schemamath_api.sip.contract imports jsonschema at module load.
  "jsonschema==4.26.0",
]

[project.urls]
Homepage = "https://github.com/schema-sandbox/proof-flow-schema-sandbox"
Repository = "https://github.com/schema-sandbox/proof-flow-schema-sandbox"
Issues = "https://github.com/schema-sandbox/proof-flow-schema-sandbox/issues"

[project.scripts]
proofflow = "schemamath_api.cli:main"
schemamath = "schemamath_api.cli:main"

[project.optional-dependencies]
dev = [
  "httpx==0.28.1",
  "pytest==9.1.1",
  "pytest-cov==6.3.0",
  "ruff==0.16.4",
  "pyyaml==6.0.3",
  "sympy==1.14.0",
]

[tool.pytest.ini_options]
pythonpath = ["apps/api"]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
ignore = [
  "E501",
  # FastAPI intentionally evaluates File/Form dependency descriptors in signatures.
  "B008",
]

[build-system]
requires = ["setuptools==84.0.0", "wheel==0.46.2"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
package-dir = {"" = "apps/api"}

[tool.setuptools.packages.find]
where = ["apps/api"]
include = ["schemamath_api*"]

# Any HTTP frontend bundle placed under apps/api/schemamath_api/_ui (prototype/
# and web_dist/) is shipped inside the wheel and served by main.py. Building it
# requires the Vite toolchain and is intentionally optional: the offline builder
# does not fabricate a bundle, so the API serves a plain-text fallback instead.
[tool.setuptools.package-data]
schemamath_api = [
  "_ui/*",
  "_ui/*/*",
  "_ui/*/*/*",
  "_plugins/*",
  "_plugins/*/*",
  "_plugins/*/*/*",
  "THIRD_PARTY_NOTICES.md",
  "sbom.cyclonedx.json",
]
