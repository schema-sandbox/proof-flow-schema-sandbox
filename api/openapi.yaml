      operationId: similar_routes_api_v1_projects__project_id__routes_similar_get
      parameters:
      - name: project_id
        in: path
        required: true
        schema:
          type: string
          format: uuid
          title: Project Id
      - name: q
        in: query
        required: true
        schema:
          type: string
          minLength: 1
          maxLength: 1000
          title: Q
      - name: limit
        in: query
        required: false
        schema:
          type: integer
          maximum: 50
          minimum: 1
          default: 10
          title: Limit
      responses:
        '200':
          description: Successful Response
          content:
