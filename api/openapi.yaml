components:
  schemas:
    Actor:
      properties:
        type:
          $ref: '#/components/schemas/ActorType'
        id:
          type: string
          maxLength: 160
          minLength: 1
          title: Id
        display_name:
          anyOf:
          - type: string
            maxLength: 240
          - type: 'null'
          title: Display Name
      additionalProperties: false
      type: object
      required:
      - type
      - id
      title: Actor
    ActorType:
      type: string
      enum:
      - human
      - model
      - tool
      - runtime
      title: ActorType
    ArenaComputeMode:
      type: string
      enum:
      - conservative
      - manual_parallel
      - custom
      title: ArenaComputeMode
    ArenaPreviewRecord:
      properties:
        recipe:
          $ref: '#/components/schemas/ArenaRecipeRecord'
        requires_human_confirmation:
          type: boolean
          title: Requires Human Confirmation
        correlated_review_warnings:
          items:
            type: string
          type: array
          title: Correlated Review Warnings
        execution_started:
          type: boolean
          title: Execution Started
          default: false
        note:
          type: string
          title: Note
          default: Preview only. ProofFlow does not use role voting to determine mathematical
            truth.
      type: object
      required:
      - recipe
      - requires_human_confirmation
      title: ArenaPreviewRecord
    ArenaRecipeCreate:
      properties:
        name:
          type: string
          maxLength: 240
          minLength: 1
          title: Name
        description:
          type: string
          maxLength: 4000
          title: Description
          default: ''
        compute_mode:
          $ref: '#/components/schemas/ArenaComputeMode'
          default: conservative
        parallel_workers:
          type: integer
          maximum: 16.0
          minimum: 0.0
          title: Parallel Workers
          default: 0
        stages:
          items:
            $ref: '#/components/schemas/ArenaStage'
          type: array
          maxItems: 32
          minItems: 1
          title: Stages
        actor:
          $ref: '#/components/schemas/Actor'
      additionalProperties: false
      type: object
      required:
      - name
      - stages
      title: ArenaRecipeCreate
    ArenaRecipeRecord:
      properties:
        recipe_id:
          type: string
          format: uuid
          title: Recipe Id
        project_id:
          type: string
          format: uuid
          title: Project Id
        name:
          type: string
          title: Name
        description:
          type: string
          title: Description
