openapi: 3.1.0
info:
  title: ProofFlow Schema Sandbox Local API
  description: Local-first experimental research workspace. It does not promise solutions
    and does not automatically label results as solved.
  version: 0.1.0-alpha.4
paths:
  /api/v1/projects:
    get:
      summary: List Projects
      operationId: list_projects_api_v1_projects_get
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                items:
                  $ref: '#/components/schemas/ProjectSummary'
                type: array
                title: Response List Projects Api V1 Projects Get
    post:
      summary: Create Project
      operationId: create_project_api_v1_projects_post
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ProjectCreate'
        required: true
      responses:
        '201':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProjectManifest'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /api/v1/projects/{project_id}:
