services:
  schemamath:
    image: python:3.12-slim
    working_dir: /workspace
    command: >-
      sh -c "pip install -e '.[dev]' &&
      PYTHONPATH=apps/api uvicorn schemamath_api.main:app --host 0.0.0.0 --port 8000"
    ports:
      - "8000:8000"
    volumes:
      - .:/workspace
      - schemamath-data:/data
    environment:
      PROOFFLOW_WORKSPACE: /data/workspaces
      PROOFFLOW_PLUGIN_ROOT: /data/plugins

volumes:
  schemamath-data:
